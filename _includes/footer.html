<footer class="pt-5 my-5 text-muted border-top">
  <div class="row">
    <div class="col-lg-7 text-end social-media-icons">
      {% for item in site.data.settings.social %}
        <a href="{{ item.link }}" class="other ms-2" target="_blank" rel="noopener" style="font-size:1.15rem"><i class="{{ item.icon }}"></i></a>
      {% endfor %}
    </div>
  </div>
  <div class="row">
    <div class="col-lg-12 text-end template-ref">
      <p style="font-size:11px" align="right">Personalized version of <a href="https://babulcseian.github.io/">Babul's template</a>.</p>
    </div>
  </div>
</footer>
