<head>
  <meta name="google-site-verification" content="PR1vYF_Y-d6T4qwhD63BkjGGDQyXgI7hjPNSbUQnYP0"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.title }}">

  <!-- Open Graph (for sharing links) -->
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:image" content="{{ site.url }}/assets/img/Babul.jpg">
  <meta property="og:type" content="website">

  <title>{{ page.title }} | {{ site.title }}</title>

  <!-- Favicon — generated from profile photo -->
  <link rel="icon" type="image/x-icon" href="{{ site.github.url }}/assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ site.github.url }}/assets/apple-touch-icon.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ site.github.url }}/assets/libs/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="{{ site.github.url }}/assets/css/main.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Icons -->
  <script defer src="{{ site.github.url }}/assets/libs/fontawesome/all.min.js"></script>
</head>
